<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">XBM2K</span><span class="brand-name"></span></a><a class="text-link" href="index.html#SHOP">← SHOP</a></nav><main class="auth-page"><div class="auth-shell glass" style="max-width:560px;grid-template-columns:1fr"><div class="auth-card"><span class="eyebrow">ACCOUNT SECURITY</span><h1 style="margin:12px 0 8px">Create a new password.</h1><p class="muted">Choose a strong password you can remember. Your old password will stop working after the update.</p><form id="resetForm"><label>New password<input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="••••••••" required></label><label>Confirm password<input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="••••••••" required></label><button class="btn primary full" type="submit">Update password <span>→</span></button></form><p id="resetMsg" class="form-msg"></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>

</script>
